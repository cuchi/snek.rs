name: CI

on:
  push:
    branches: [master]
  pull_request:
    branches: [master]

jobs:
  test:
    name: ${{ matrix.os }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]

    steps:
      - uses: actions/checkout@v4

      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable

      # ---- platform-specific SDL2 setup --------------------------------

      - name: Install SDL2 (Linux)
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y libsdl2-dev libsdl2-mixer-dev

      - name: Install SDL2 (macOS)
        if: runner.os == 'macOS'
        run: brew install sdl2 sdl2_mixer

      - name: Install SDL2 (Windows)
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          $sdl_ver  = "2.30.12"
          $mix_ver  = "2.8.1"

          Invoke-WebRequest `
            "https://github.com/libsdl-org/SDL/releases/download/release-$sdl_ver/SDL2-devel-$sdl_ver-VC.zip" `
            -OutFile sdl2.zip
          Expand-Archive sdl2.zip -DestinationPath sdl2

          Invoke-WebRequest `
            "https://github.com/libsdl-org/SDL_mixer/releases/download/release-$mix_ver/SDL2_mixer-devel-$mix_ver-VC.zip" `
            -OutFile mixer.zip
          Expand-Archive mixer.zip -DestinationPath mixer

          $sdl2  = Resolve-Path "sdl2\SDL2-$sdl_ver"
          $mixer = Resolve-Path "mixer\SDL2_mixer-$mix_ver"

          echo "SDL2_LIB_DIR=$sdl2\lib\x64" | Out-File -FilePath $env:GITHUB_ENV -Append
          echo "INCLUDE=$sdl2\include;$mixer\include" | Out-File -FilePath $env:GITHUB_ENV -Append
          echo "LIB=$sdl2\lib\x64;$mixer\lib\x64" | Out-File -FilePath $env:GITHUB_ENV -Append

          # Copy DLLs next to the test binary so they are found at runtime.
          # (cargo places binaries in target/debug/deps/)
          New-Item -ItemType Directory -Force -Path target\debug\deps
          Copy-Item "$sdl2\lib\x64\SDL2.dll"    target\debug\deps\
          Copy-Item "$mixer\lib\x64\SDL2_mixer.dll" target\debug\deps\

      # ---- build & test -----------------------------------------------

      - name: Build
        run: cargo build --verbose

      - name: Test
        run: cargo test --verbose

      - name: Clippy
        run: cargo clippy -- -D warnings
